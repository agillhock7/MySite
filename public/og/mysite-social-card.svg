<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MySite AI Workspace Experience</title>
  <desc id="desc">Social preview for MySite: AI conversations, prompt skill game, and personalized workspaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="58%" stop-color="#04142e" />
      <stop offset="100%" stop-color="#062635" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="180" cy="96" r="160" fill="#22d3ee" opacity="0.18" filter="url(#blur)" />
  <circle cx="1020" cy="540" r="210" fill="#14b8a6" opacity="0.16" filter="url(#blur)" />

  <rect x="60" y="56" width="1080" height="518" rx="26" fill="rgba(2,12,30,0.72)" stroke="rgba(34,211,238,0.38)" stroke-width="2" />

  <g font-family="'IBM Plex Mono', 'Space Mono', monospace" fill="#c7f9f0">
    <text x="112" y="148" font-size="28" letter-spacing="3">MYSITE</text>
    <text x="112" y="232" font-size="72" font-weight="700" fill="#ecfeff">AI Workspace Experience</text>
    <text x="112" y="296" font-size="28" fill="#99f6e4">A sample of AI capabilities with custom workspaces</text>
  </g>

  <g transform="translate(112 360)">
    <rect width="300" height="130" rx="14" fill="rgba(6,78,59,0.35)" stroke="rgba(20,184,166,0.45)" />
    <text x="24" y="42" font-size="20" fill="#67e8f9" font-family="'IBM Plex Mono', monospace">AI Conversations</text>
    <text x="24" y="78" font-size="17" fill="#d1fae5" font-family="'IBM Plex Mono', monospace">Multimodal thread UX</text>
  </g>

  <g transform="translate(448 360)">
    <rect width="300" height="130" rx="14" fill="rgba(8,47,73,0.32)" stroke="rgba(34,211,238,0.42)" />
    <text x="24" y="42" font-size="20" fill="#67e8f9" font-family="'IBM Plex Mono', monospace">Prompt Skill Game</text>
    <text x="24" y="78" font-size="17" fill="#d1fae5" font-family="'IBM Plex Mono', monospace">Train + earn badges</text>
  </g>

  <g transform="translate(784 360)">
    <rect width="300" height="130" rx="14" fill="rgba(12,74,110,0.28)" stroke="rgba(34,211,238,0.42)" />
    <text x="24" y="42" font-size="20" fill="#67e8f9" font-family="'IBM Plex Mono', monospace">Adaptive Dashboard</text>
    <text x="24" y="78" font-size="17" fill="#d1fae5" font-family="'IBM Plex Mono', monospace">Personalized workspace flow</text>
  </g>

  <rect x="112" y="528" width="420" height="10" rx="5" fill="url(#accent)" />
</svg>
